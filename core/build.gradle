plugins { id 'fabric-loom' }
version = project.dfu_version
group = 'dev.intensetomato'
base { archivesName = 'diamondfire-utilities' }
repositories { mavenCentral(); maven { url = "https://maven.terraformersmc.com/" } }
dependencies { minecraft "com.mojang:minecraft:${minecraft_version}"; mappings loom.officialMojangMappings(); modImplementation "net.fabricmc:fabric-loader:${loader_version}"; modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"; modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}" }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
